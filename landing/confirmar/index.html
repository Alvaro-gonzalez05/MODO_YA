<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<title>Confirmar tu cuenta · MODO YA</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=Outfit:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/legales.css">
</head>
<!-- =====================================================================
     A dónde lleva el mail de confirmación de cuenta (y el de cambio de
     email). La plantilla (supabase/correo/) arma el link con el token_hash y
     el tipo; acá se canjea con un botón y no al abrir, por el mismo motivo
     que en /nueva-clave: los antivirus del correo abren los links solos.
     ===================================================================== -->
<body>

<header class="top">
  <div class="wrap">
    <a class="logo" href="/" aria-label="MODO YA, inicio">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <g stroke="#F5C518" stroke-width="5" stroke-linecap="round"><path d="M4 40h18M10 52h12M2 64h20"/></g>
        <path d="M70 4C46 4 28 22 28 45c0 29 42 71 42 71s42-42 42-71C112 22 94 4 70 4z" fill="#F5C518"/>
        <circle cx="70" cy="45" r="30" fill="#0A0A0A"/>
        <g transform="translate(52 34) scale(.56)" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="14" cy="34" r="8" stroke="#fff" stroke-width="4"/><circle cx="51" cy="34" r="8" stroke="#fff" stroke-width="4"/>
          <path d="M10 25h22l6-6h8l5 15" stroke="#F5C518" stroke-width="4"/><path d="M22 34h14l6-9" stroke="#fff" stroke-width="4"/>
        </g>
      </svg>
      <span class="wordmark">MODO <span class="ya">YA</span></span>
    </a>
  </div>
</header>

<main>
  <section class="portada">
    <div class="wrap">
      <span class="etiqueta">Tu cuenta</span>
      <h1>Confirmá tu <span class="ya">email</span></h1>
      <p>Un toque y listo: después entrás a la app con tu email y tu contraseña.</p>
    </div>
  </section>

  <div class="wrap">
    <article class="hoja">
      <div class="form" id="form">
        <p class="error" id="error" role="alert"></p>
        <button class="btn" type="button" id="confirmar">Confirmar mi email</button>
      </div>
      <div class="aviso-ok" id="ok" role="status">
        <p><b>Listo, tu email quedó confirmado.</b> Volvé a la app de MODO YA y entrá.</p>
      </div>
    </article>
  </div>
</main>

<footer class="pie">
  <div class="wrap">
    <span>© 2026 MODO YA · Malargüe, Mendoza</span>
    <nav aria-label="Legales">
      <a href="/terminos">Términos</a>
      <a href="/privacidad">Privacidad</a>
      <a href="/eliminar-cuenta">Eliminar cuenta</a>
    </nav>
  </div>
</footer>

<script>
const SUPABASE = {
  url: "https://wqahdncdqnzrusrmdyui.supabase.co",
  key: "sb_publishable_kAgKdriyxNzmYPwfYhGZNw_katA01GI"
};
const q = new URLSearchParams(location.search);
const token = q.get("token_hash");
// "email" para la cuenta nueva, "email_change" para el cambio de email. Se
// acepta solo uno de esos dos: esta página no tiene por qué canjear otra cosa.
const tipo = ["email", "email_change"].includes(q.get("type")) ? q.get("type") : "email";
const boton = document.getElementById("confirmar");
const error = document.getElementById("error");

if (!token) {
  error.textContent = "Este link no sirve. Abrí el último mail que te mandamos.";
  boton.disabled = true;
}

boton.addEventListener("click", async () => {
  boton.disabled = true;
  error.textContent = "";
  const r = await fetch(`${SUPABASE.url}/auth/v1/verify`, {
    method: "POST",
    headers: { apikey: SUPABASE.key, "Content-Type": "application/json" },
    body: JSON.stringify({ type: tipo, token_hash: token })
  }).catch(() => null);
  if (r && r.ok) {
    document.getElementById("form").hidden = true;
    document.getElementById("ok").classList.add("is-on");
  } else {
    error.textContent = "El link venció o ya se usó. Si todavía no podés entrar, registrate de nuevo con el mismo email.";
    boton.disabled = false;
  }
});
</script>
</body>
</html>
