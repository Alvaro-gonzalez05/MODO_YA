name: Publicar instaladores

# Compila las dos apps y publica los instaladores en Releases.
#
# Se dispara:
#   - al empujar un tag v*   (git tag v1.2.0 && git push origin v1.2.0)
#   - a mano desde la pestaña Actions (deja los archivos como artefactos,
#     sin crear el release)
#
# Actualizaciones automáticas: además de los instaladores se publica
# ultima.json. Las apps instaladas lo leen de
# releases/latest/download/ultima.json y ofrecen actualizar. Para que una
# versión sea OBLIGATORIA (la app no deja seguir sin actualizar), crear el tag
# anotado con [obligatoria] en el mensaje:
#   git tag -a v1.3.0 -m "[obligatoria] Cambios en la base"
# El resto del mensaje se muestra como notas en el aviso.
#
# Los nombres de los archivos no llevan versión a propósito: así los links
# .../releases/latest/download/<archivo> siempre bajan la última.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.4'
  # URL + publishable key (pública por diseño). Ver .gitignore.
  CONFIG: env/publico.json

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Análisis
        run: flutter analyze

      # 1.2.3 -> versionCode 10203. Tiene que crecer en cada versión: Android
      # no instala una actualización con un versionCode menor.
      - name: Versión desde el tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0"; fi
          IFS=. read -r mayor menor parche <<< "$v"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "BUILD=$(( ${mayor:-0} * 10000 + ${menor:-0} * 100 + ${parche:-0} ))" >> "$GITHUB_ENV"

      # Siempre la misma clave: con otra, Android se niega a instalar la
      # actualización encima de la app ya instalada.
      - name: Clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Faltan los secretos ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD. Sin la clave de siempre las apps instaladas no se pueden actualizar."
              exit 1
            fi
            echo "::warning::Sin clave de firma: el APK sale firmado con la clave de debug (solo para probar)."
            exit 0
          fi
          # Al pegar el secreto en la web se cuelan espacios o saltos de línea.
          KEYSTORE_PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '
')
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' 
	' | base64 -d > "$RUNNER_TEMP/modoya-release.jks" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 no es un base64 válido (${#KEYSTORE_BASE64} caracteres; el archivo tiene 5816). ¿Quedó incompleto o se cargó la contraseña en su lugar?"
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/modoya-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias modoya > /dev/null 2>&1; then
            echo "::error::La clave se decodificó ($(stat -c %s "$RUNNER_TEMP/modoya-release.jks") bytes) pero no abre con ANDROID_KEYSTORE_PASSWORD (${#KEYSTORE_PASSWORD} caracteres). Revisar la contraseña."
            exit 1
          fi
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=modoya\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/modoya-release.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/key.properties"
          echo "MY_KEY_PROPERTIES=$RUNNER_TEMP/key.properties" >> "$GITHUB_ENV"

      # --split-per-abi: un APK de ~20 MB por arquitectura en vez de uno de 50.
      - name: Compilar MODO YA
        working-directory: apps/modo_ya
        run: >
          flutter build apk --release --split-per-abi
          --build-name=${{ env.VERSION }} --build-number=${{ env.BUILD }}
          --dart-define-from-file=../../${{ env.CONFIG }}
          --dart-define=MY_VERSION=${{ env.VERSION }}

      - name: Compilar MODO YA Rider
        working-directory: apps/repartidor
        run: >
          flutter build apk --release --split-per-abi
          --build-name=${{ env.VERSION }} --build-number=${{ env.BUILD }}
          --dart-define-from-file=../../${{ env.CONFIG }}
          --dart-define=MY_VERSION=${{ env.VERSION }}

      - name: Renombrar para que se entienda cuál bajar
        run: |
          mkdir -p salida
          a=apps/modo_ya/build/app/outputs/flutter-apk
          r=apps/repartidor/build/app/outputs/flutter-apk
          mv $a/app-arm64-v8a-release.apk   salida/MODO_YA-Android.apk
          mv $a/app-armeabi-v7a-release.apk salida/MODO_YA-Android-32bits.apk
          mv $r/app-arm64-v8a-release.apk   salida/MODO_YA-Rider-Android.apk
          mv $r/app-armeabi-v7a-release.apk salida/MODO_YA-Rider-Android-32bits.apk
          ls -la salida

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: salida/*.apk

  windows:
    name: Windows (instalador)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Compilar y armar el instalador
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.0.0' }
          .\installer\armar_windows.ps1 -Version $version -Entorno $env:CONFIG
          New-Item -ItemType Directory -Force salida | Out-Null
          Move-Item "build\instaladores\MODO_YA_Setup_$version.exe" salida\MODO_YA-Windows-Setup.exe
          # Para quien no puede instalar nada: se descomprime y se ejecuta.
          Compress-Archive -Path apps\modo_ya\build\windows\x64\runner\Release\* -DestinationPath salida\MODO_YA-Windows-portable.zip
          Get-ChildItem salida

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: salida/*

  publicar:
    name: Publicar en Releases
    needs: [android, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # checkout convierte los tags anotados en livianos y se pierde el
      # mensaje: se vuelve a traer el tag tal cual.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Traer el tag con su mensaje
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - uses: actions/download-artifact@v4
        with:
          path: entrega
          merge-multiple: true

      - name: Armar ultima.json (actualizaciones automáticas)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          MENSAJE="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/-----BEGIN PGP/,$d')"
          OBLIGATORIA=false
          if printf '%s' "$MENSAJE" | grep -qi '\[obligatoria\]'; then OBLIGATORIA=true; fi
          NOTAS="$(printf '%s' "$MENSAJE" | sed 's/\[obligatoria\]//Ig' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          # Un tag liviano no tiene mensaje propio: git devuelve el del commit.
          jq -n \
            --arg version "$VERSION" \
            --arg fecha "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notas "$NOTAS" \
            --argjson obligatoria "$OBLIGATORIA" \
            --arg base "$BASE" \
            '{version: $version, fecha: $fecha, notas: $notas, obligatoria: $obligatoria,
              archivos: {
                "modo_ya-windows":       ($base + "/MODO_YA-Windows-Setup.exe"),
                "modo_ya-android-arm64": ($base + "/MODO_YA-Android.apk"),
                "modo_ya-android-arm32": ($base + "/MODO_YA-Android-32bits.apk"),
                "rider-android-arm64":   ($base + "/MODO_YA-Rider-Android.apk"),
                "rider-android-arm32":   ($base + "/MODO_YA-Rider-Android-32bits.apk")
              }}' > entrega/ultima.json
          cat entrega/ultima.json

      - uses: softprops/action-gh-release@v2
        with:
          name: MODO YA ${{ github.ref_name }}
          files: entrega/*
          make_latest: true
          body: |
            ## Descargas

            | App | Para | Archivo |
            |---|---|---|
            | **MODO YA** | Android (casi todos los celulares) | [MODO_YA-Android.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/MODO_YA-Android.apk) |
            | **MODO YA** | Windows (instalador) | [MODO_YA-Windows-Setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/MODO_YA-Windows-Setup.exe) |
            | **MODO YA** | Windows sin instalar | [MODO_YA-Windows-portable.zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/MODO_YA-Windows-portable.zip) |
            | **MODO YA Rider** | Android | [MODO_YA-Rider-Android.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/MODO_YA-Rider-Android.apk) |

            MODO YA es la app de clientes, locales y administración; cada uno ve
            lo suyo según su cuenta. Los riders usan MODO YA Rider.

            Celulares Android viejos (32 bits): `MODO_YA-Android-32bits.apk` y
            `MODO_YA-Rider-Android-32bits.apk`, abajo en *Assets*.

            Las apps instaladas desde la 1.1.0 avisan solas cuando hay una versión
            nueva y se actualizan con un botón.

            > **Android:** el APK no viene de Play Store, así que hay que permitir
            > "instalar apps de origen desconocido".
            > **Windows:** no está firmado; si aparece "Windows protegió su PC":
            > *Más información* → *Ejecutar de todas formas*.
