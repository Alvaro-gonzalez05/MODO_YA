<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MODO YA: app para riders de MODO YA.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141416">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MODO YA Rider">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MODO YA Rider</title>
  <link rel="manifest" href="manifest.json">

  <!-- Pantalla de carga de marca mientras baja el código de la app: negra con
       el logo y un anillo amarillo, igual que el splash de la app. Se saca sola
       cuando Flutter dibuja el primer cuadro. -->
  <style>
    html, body { margin: 0; height: 100%; background: #141416; }
    #cargando {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
      background: #141416; transition: opacity .35s ease;
    }
    #cargando.fuera { opacity: 0; pointer-events: none; }
    #cargando img { width: min(58vw, 240px); animation: entra .7s cubic-bezier(.34,1.56,.64,1) both; }
    #cargando .anillo {
      width: 36px; height: 36px; border-radius: 50%;
      border: 4px solid rgba(255,200,0,.25); border-top-color: #FFC800;
      animation: gira .9s linear infinite;
    }
    @keyframes gira { to { transform: rotate(360deg); } }
    @keyframes entra { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <div id="cargando">
    <img src="splash.png" alt="MODO YA Rider">
    <div class="anillo"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var c = document.getElementById('cargando');
      if (!c) return;
      c.classList.add('fuera');
      setTimeout(function () { c.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
