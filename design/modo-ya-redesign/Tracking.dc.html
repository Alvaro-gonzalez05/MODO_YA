<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Manrope:wght@500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    .iconbtn:hover { background: rgba(255,255,255,0.1); }
  </style>
</helmet>
<div style="width:375px; height:812px; background:#0D0D0D; font-family:'Manrope',sans-serif; color:#fff; box-sizing:border-box; display:flex; flex-direction:column; overflow:hidden;">

  <div style="display:flex; align-items:center; gap:14px; padding:22px 20px 4px 20px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <span style="font-family:'Baloo 2',sans-serif; font-weight:700; font-size:18px;">Tu pedido</span>
  </div>

  <div style="flex:1; overflow:hidden; padding:14px 20px 0 20px; display:flex; flex-direction:column; gap:16px;">

    <!-- timeline -->
    <div style="display:flex; flex-direction:column; padding:14px 4px; border-radius:18px; background:#151517; border:1px solid rgba(255,255,255,0.06);">

      <div style="display:flex; gap:14px;">
        <div style="display:flex; flex-direction:column; align-items:center; width:24px;">
          <div style="width:24px; height:24px; border-radius:50%; background:#FFC800; display:flex; align-items:center; justify-content:center; flex-shrink:0;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#141208" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6"/></svg></div>
          <div style="width:2px; flex:1; min-height:22px; background:#FFC800;"></div>
        </div>
        <div style="padding-bottom:16px;">
          <div style="font-size:14px; font-weight:700;">Pedido confirmado</div>
          <div style="font-size:12px; color:#75757D; font-weight:600; margin-top:2px;">11:42</div>
        </div>
      </div>

      <div style="display:flex; gap:14px;">
        <div style="display:flex; flex-direction:column; align-items:center; width:24px;">
          <div style="width:24px; height:24px; border-radius:50%; background:#FFC800; display:flex; align-items:center; justify-content:center; flex-shrink:0;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#141208" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6"/></svg></div>
          <div style="width:2px; flex:1; min-height:22px; background:#FFC800;"></div>
        </div>
        <div style="padding-bottom:16px;">
          <div style="font-size:14px; font-weight:700;">En preparación</div>
          <div style="font-size:12px; color:#75757D; font-weight:600; margin-top:2px;">11:50</div>
        </div>
      </div>

      <div style="display:flex; gap:14px;">
        <div style="display:flex; flex-direction:column; align-items:center; width:24px;">
          <div style="position:relative; width:24px; height:24px; flex-shrink:0;">
            <div style="position:absolute; inset:-5px; border-radius:50%; background:rgba(255,200,0,0.22);"></div>
            <div style="position:relative; width:24px; height:24px; border-radius:50%; background:#FFC800; display:flex; align-items:center; justify-content:center;">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#141208" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h13M12 6l7 6-7 6"/></svg>
            </div>
          </div>
          <div style="width:2px; flex:1; min-height:22px; background:repeating-linear-gradient(#3A3A40 0 4px, transparent 4px 8px);"></div>
        </div>
        <div style="padding-bottom:16px;">
          <div style="font-size:14px; font-weight:700; color:#FFC800;">En camino</div>
          <div style="font-size:12px; color:#B9B9C2; font-weight:600; margin-top:2px;">El repartidor ya salió · a minutos de llegar</div>
        </div>
      </div>

      <div style="display:flex; gap:14px;">
        <div style="display:flex; flex-direction:column; align-items:center; width:24px;">
          <div style="width:24px; height:24px; border-radius:50%; border:2px solid #3A3A40; flex-shrink:0;"></div>
        </div>
        <div>
          <div style="font-size:14px; font-weight:700; color:#6B6B74;">¡Entregado!</div>
        </div>
      </div>
    </div>

    <!-- map -->
    <div style="position:relative; height:180px; border-radius:18px; overflow:hidden; background:#101013; border:1px solid rgba(255,255,255,0.06); flex-shrink:0;">
      <svg width="100%" height="100%" viewBox="0 0 335 180" style="position:absolute; inset:0;">
        <g stroke="#1E1E24" stroke-width="1.5">
          <line x1="0" y1="40" x2="335" y2="40"/><line x1="0" y1="90" x2="335" y2="90"/><line x1="0" y1="140" x2="335" y2="140"/>
          <line x1="70" y1="0" x2="70" y2="180"/><line x1="160" y1="0" x2="160" y2="180"/><line x1="250" y1="0" x2="250" y2="180"/>
        </g>
        <path d="M50 45 C 90 70, 120 40, 165 78 S 250 60, 275 130" fill="none" stroke="#FFC800" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 10"/>
        <circle cx="50" cy="45" r="13" fill="#FFC800"/>
        <g transform="translate(50,45)"><path d="M-5 -3 L0 4 L5 -3 Z" fill="none" stroke="#141208" stroke-width="1.6" stroke-linejoin="round" transform="translate(0,-1)"/></g>
        <circle cx="165" cy="78" r="15" fill="#0D0D0D" stroke="#FFC800" stroke-width="2.5"/>
        <g fill="#FFC800" transform="translate(154,71) scale(0.42)">
          <circle cx="16" cy="20" r="5"/><circle cx="44" cy="20" r="5"/><rect x="15" y="17" width="30" height="4" rx="2"/>
          <rect x="30" y="0" width="12.5" height="9.5" rx="2.6"/><path d="M22 17 L30 5 L36.3 5 L33 17 Z"/><circle cx="23.5" cy="-1" r="4.2"/>
        </g>
        <circle cx="275" cy="130" r="13" fill="#F4F4F6"/>
        <path d="M269 132 l6-5.5 6 5.5v6.5h-4v-4h-4v4h-4z" fill="#141208" transform="translate(0,-1)"/>
      </svg>
    </div>

    <!-- repartidor -->
    <div style="display:flex; align-items:center; gap:12px; padding:14px; border-radius:18px; background:#151517; border:1px solid rgba(255,255,255,0.06); flex-shrink:0;">
      <div style="width:48px; height:48px; border-radius:50%; background:#FFC800; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <span style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:19px; color:#141208;">M</span>
      </div>
      <div style="flex:1;">
        <div style="display:flex; align-items:center; gap:5px;">
          <span style="font-size:14.5px; font-weight:700;">Marcos</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="#FFC800"><path d="M12 2.5l2.9 6 6.6.7-4.9 4.6 1.3 6.5L12 17l-5.9 3.3 1.3-6.5-4.9-4.6 6.6-.7z"/></svg>
          <span style="font-size:12px; font-weight:700; color:#B9B9C2;">4.9</span>
        </div>
        <div style="font-size:12px; color:#75757D; font-weight:600; margin-top:2px;">Tu repartidor · Moto 150cc · AT238C</div>
      </div>
      <div class="iconbtn" style="width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:center; cursor:pointer;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4.5c1 0 2.7.3 3.3 2 .4 1 .1 2-.5 2.7l-1 1c.9 2 2.6 3.7 4.6 4.6l1-1c.7-.6 1.7-.9 2.7-.5 1.7.6 2 2.3 2 3.3 0 1.2-1 2.4-2.3 2.4C9.9 19 5 14.1 5 7.8 5 6.5 4.8 4.5 6 4.5z"/></svg>
      </div>
      <div class="iconbtn" style="width:38px; height:38px; border-radius:50%; background:#FFC800; display:flex; align-items:center; justify-content:center; cursor:pointer;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#141208" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4V5z"/></svg>
      </div>
    </div>
  </div>

  <dc-import name="BottomNav" active="pedidos" hint-size="375,88"></dc-import>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {}
</script>
</body>
</html>
