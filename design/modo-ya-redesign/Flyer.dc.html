<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Manrope:wght@500;600;700;800&display=swap">
  <style>body { margin: 0; }</style>
</helmet>
<div style="width:375px; height:812px; position:relative; overflow:hidden; background:#0B0B0D; font-family:'Manrope',sans-serif; color:#fff; box-sizing:border-box;">

  <div style="position:absolute; top:60px; left:50%; transform:translateX(-50%); width:380px; height:380px; border-radius:50%; background:radial-gradient(circle, rgba(255,200,0,0.14) 0%, rgba(255,200,0,0) 68%);"></div>

  <svg width="375" height="330" viewBox="0 0 375 330" style="position:absolute; bottom:150px; left:0;">
    <polygon points="0,180 60,90 130,150 190,70 260,140 320,85 375,160 375,330 0,330" fill="#18181D"/>
    <polygon points="0,230 90,160 160,200 230,140 300,195 375,170 375,330 0,330" fill="#101013"/>
    <polygon points="0,270 50,238 100,262 150,232 210,266 270,236 320,262 375,240 375,330 0,330" fill="#0A0A0C"/>
    <g fill="#FFC800" opacity="0.55">
      <circle cx="46" cy="254" r="1.5"/><circle cx="112" cy="248" r="1.5"/><circle cx="176" cy="244" r="1.5"/>
      <circle cx="256" cy="246" r="1.5"/><circle cx="330" cy="250" r="1.5"/>
    </g>
    <rect x="0" y="292" width="375" height="18" fill="#0D0D0F"/>
    <line x1="0" y1="301" x2="375" y2="301" stroke="#242429" stroke-width="2" stroke-dasharray="14 12"/>
    <g opacity="0.85">
      <ellipse cx="118" cy="286" rx="52" ry="4.5" fill="#FFC800" opacity="0.32"/>
      <ellipse cx="132" cy="286" rx="30" ry="3.4" fill="#FFE49A" opacity="0.55"/>
    </g>
    <g fill="#FFC800" transform="translate(148,270) scale(1.15)">
      <circle cx="16" cy="20" r="5"/><circle cx="44" cy="20" r="5"/>
      <rect x="15" y="17" width="30" height="4" rx="2"/>
      <rect x="30" y="0" width="12.5" height="9.5" rx="2.6"/>
      <path d="M22 17 L30 5 L36.3 5 L33 17 Z"/>
      <circle cx="23.5" cy="-1" r="4.2"/>
    </g>
  </svg>

  <div style="position:relative; height:100%; display:flex; flex-direction:column; box-sizing:border-box; padding:26px 24px 0 24px;">

    <div style="align-self:flex-end; display:flex; align-items:center; gap:8px; padding:9px 14px; border-radius:14px; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.1); max-width:150px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFC800" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><rect x="7" y="2" width="10" height="20" rx="2.4"/><path d="M11 18h2"/></svg>
      <span style="font-size:10.5px; font-weight:700; line-height:1.25; color:#E4E4E8;">Todo lo que necesitás, en una app.</span>
    </div>

    <div style="margin-top:26px;">
      <dc-import name="Logo" size="86" layout="row" hint-size="260,110"></dc-import>
    </div>
    <span style="margin-top:8px; font-size:11px; font-weight:700; letter-spacing:0.4px; color:#FFC800;">TU DELIVERY, CUANDO Y DONDE LO NECESITÁS.</span>

    <div style="margin-top:22px; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:30px; line-height:1.08; letter-spacing:0.2px;">
      DELIVERY<br><span style="color:#fff;">RÁPIDO,</span> SIMPLE<br><span style="color:#FFC800;">Y LOCAL</span>
    </div>

    <div style="margin-top:20px; display:flex; flex-direction:column; gap:11px;">
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="width:30px; height:30px; border-radius:9px; background:rgba(255,200,0,0.14); display:flex; align-items:center; justify-content:center; flex-shrink:0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFC800" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg></div>
        <span style="font-size:12.5px; font-weight:700;">Rápido <span style="color:#8C8C94; font-weight:600;">— Llegamos antes</span></span>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="width:30px; height:30px; border-radius:9px; background:rgba(255,200,0,0.14); display:flex; align-items:center; justify-content:center; flex-shrink:0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFC800" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6"/></svg></div>
        <span style="font-size:12.5px; font-weight:700;">Simple <span style="color:#8C8C94; font-weight:600;">— Pedí fácil, desde la app</span></span>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="width:30px; height:30px; border-radius:9px; background:rgba(255,200,0,0.14); display:flex; align-items:center; justify-content:center; flex-shrink:0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFC800" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-9.6-9A5.3 5.3 0 0112 5.6 5.3 5.3 0 0121.6 11c-2.1 4.4-9.6 9-9.6 9z"/></svg></div>
        <span style="font-size:12.5px; font-weight:700;">Local <span style="color:#8C8C94; font-weight:600;">— Apoyamos lo nuestro</span></span>
      </div>
    </div>

    <div style="flex:1;"></div>

    <div style="display:flex; align-items:center; gap:12px; padding:16px 18px; border-radius:20px; background:#FFC800; margin-bottom:16px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141208" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M12 21s-7-6.5-7-11.5A7 7 0 0119 9.5C19 14.5 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.3"/></svg>
      <div style="flex:1;">
        <div style="font-size:11px; font-weight:700; color:#4A3D00;">PRÓXIMAMENTE EN</div>
        <div style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:21px; color:#141208; line-height:1.1;">MALARGÜE</div>
      </div>
      <div style="width:40px; height:40px; border-radius:50%; background:#141208; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFC800" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
      </div>
    </div>

    <div style="text-align:center; padding-bottom:22px;">
      <div style="height:1px; background:repeating-linear-gradient(to right, #FFC800 0 6px, transparent 6px 12px); margin-bottom:12px;"></div>
      <span style="font-size:10.5px; font-weight:700; letter-spacing:0.6px; color:#8C8C94;">MODO YA, TU CIUDAD EN MOVIMIENTO.</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {}
</script>
</body>
</html>
