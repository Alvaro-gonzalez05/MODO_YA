        </div>
        <div style="display:flex; align-items:center; gap:10px; background:#17171A; border-radius:999px; padding:5px 6px; border:1px solid rgba(255,255,255,0.07);">

    <button class="cta" style="width:100%; height:56px; border:none; border-radius:28px; background:#FFC800; box-shadow:0 10px 24px rgba(255,200,0,0.25); font-family:'Baloo 2',sans-serif; font-weight:700; font-size:16.5px; color:#141208; cursor:pointer;">Continuar</button>
